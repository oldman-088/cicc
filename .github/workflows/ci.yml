name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cicc_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cicc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cicc_test -d cicc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cicc_test:test-only-password@127.0.0.1:5432/cicc_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
            apps/api/requirements.lock
            apps/api/requirements-dev.lock
      - run: python ../../scripts/check_python_locks.py
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit -r requirements-dev.lock
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
