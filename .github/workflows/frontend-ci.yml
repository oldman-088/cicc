name: Frontend CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test -- --reporter=dot

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser end-to-end tests
        run: |
          set -o pipefail
          npm run test:e2e --workspace=@cicc/web 2>&1 | tee "$RUNNER_TEMP/playwright-e2e.log"

      - name: Report Playwright failure details
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/playwright-e2e.log" ]]; then
            python3 - "$RUNNER_TEMP/playwright-e2e.log" <<'PY'
          from pathlib import Path
          import sys

          text = Path(sys.argv[1]).read_text(errors="replace")[-12000:]
          escaped = (text.replace("%", "%25")
                     .replace("\r", "%0D")
                     .replace("\n", "%0A")
                     .replace(":", "%3A")
                     .replace(",", "%2C"))
          print(f"::error title=Playwright failure details::{escaped}")
          import os

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Playwright failure details\n\n```text\n")
              summary.write(text[-6000:])
              summary.write("\n```\n")
          PY
          fi

      - name: Production build
        run: npm run build

      - name: Preserve Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
