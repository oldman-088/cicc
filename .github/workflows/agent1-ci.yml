name: Agent 1 CI

on:
  push:
    branches: [arena/961971ed-cicc]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/agent1-ci.yml"
      - "apps/api/**"
      - "apps/web/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent1-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (Python 3.11)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'arena/961971ed-cicc' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API test dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements-dev.txt

      - name: Run full API suite
        working-directory: apps/api
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q

  postgres:
    name: PostgreSQL integration tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'arena/961971ed-cicc' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Install API test dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL-selected suite
        working-directory: apps/api
        env:
          PYTHONPATH: .
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider -k "postgres or pg"

  web:
    name: Web tests, typecheck, and production build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'arena/961971ed-cicc' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Run web tests
        working-directory: apps/web
        run: npm test

      - name: Typecheck
        working-directory: apps/web
        run: npm run typecheck

      - name: Build production bundle
        working-directory: apps/web
        run: npm run build
