name: web-ci
on:
  pull_request:
    paths: ["apps/web/**", "package.json", "package-lock.json", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build --workspace=@cicc/web
      - name: Install Playwright Chromium (browser-capable CI runner)
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser visual QA (EXECUTED in CI, not in sandbox)
        run: npm run test:e2e
        working-directory: apps/web
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
