name: web-ci
on:
  pull_request:
    paths: ["apps/web/**", "package.json", "package-lock.json", ".github/workflows/web-ci.yml"]
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm run typecheck
      - name: Run unit tests (log uploaded as artifact on failure)
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test.log
      - run: npm run build --workspace=@cicc/web
      - name: Install Playwright Chromium (browser-capable CI runner)
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Run browser visual QA (EXECUTED in CI, not in sandbox)
        shell: bash
        working-directory: apps/web
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-test.log
      - name: Comment Playwright failures on the PR (log hosts are not sandbox-reachable)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('apps/web/e2e-test.log', 'utf8'); } catch {}
            const tail = log.split('\n').filter(l => /Error|expect|FAIL|failed|Timeout|✘|›/.test(l)).slice(-60).join('\n').slice(0, 6000);
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**web-ci Playwright failure** (run ${context.runId}, commit ${context.sha.slice(0,7)}) — filtered failure lines:\n\n\`\`\`\n${tail || log.slice(-5000)}\n\`\`\``
            });
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            apps/web/test-results
            apps/web/playwright-report
            unit-test.log
            apps/web/e2e-test.log
            apps/web/unit-test.log
          if-no-files-found: ignore
